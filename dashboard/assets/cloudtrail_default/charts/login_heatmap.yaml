# DSH-19: Console Login Activity Heatmap (Hour-of-Day × Day-of-Week, JST)
# Pivot table showing login counts by hour (JST) and day of week.
# Off-hours logins (22:00–06:00 JST, weekends) by human users may indicate
# account compromise or credential sharing.
# MITRE ATT&CK: TA0001 Initial Access
uuid: 19a1b2c3-d4e5-6789-abcd-ef0123456789
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Login Activity Heatmap (Hour × Day)
viz_type: pivot_table_v2
description: >
  Console login counts by hour-of-day (JST) and day-of-week (DSH-19).
  Off-hours logins — especially late-night or weekend activity — by human
  principals are a strong indicator of account compromise or credential misuse.
  MITRE ATT&CK: TA0001 Initial Access.
query_context: ""
params:
  groupbyRows:
    - expressionType: SQL
      sqlExpression: >-
        CASE EXTRACT(DOW FROM event_time)
          WHEN 0 THEN '0_Sun'
          WHEN 1 THEN '1_Mon'
          WHEN 2 THEN '2_Tue'
          WHEN 3 THEN '3_Wed'
          WHEN 4 THEN '4_Thu'
          WHEN 5 THEN '5_Fri'
          WHEN 6 THEN '6_Sat'
        END
      label: day_of_week
      hasCustomLabel: true
  groupbyColumns:
    - expressionType: SQL
      sqlExpression: "LPAD(CAST(EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') AS VARCHAR), 2, '0')"
      label: hour_jst
      hasCustomLabel: true
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: login_count
      hasCustomLabel: true
      optionName: metric_heatmap_logins
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "event_source = 'signin.amazonaws.com' AND event_name = 'ConsoleLogin'"
      filterOptionName: filter_heatmap_login
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 10000
  aggregateFunction: SUM
  valueFormat: SMART_NUMBER
  rowTotals: true
  colTotals: true
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     CASE EXTRACT(DOW FROM event_time)
#       WHEN 0 THEN '0_Sun' WHEN 1 THEN '1_Mon' WHEN 2 THEN '2_Tue'
#       WHEN 3 THEN '3_Wed' WHEN 4 THEN '4_Thu' WHEN 5 THEN '5_Fri'
#       WHEN 6 THEN '6_Sat'
#     END                                                        AS day_of_week,
#     LPAD(CAST(
#       EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') AS VARCHAR
#     ), 2, '0')                                                  AS hour_jst,
#     COUNT(*)                                                    AS login_count
# FROM cloudtrail_events
# WHERE event_source = 'signin.amazonaws.com'
#   AND event_name   = 'ConsoleLogin'
# GROUP BY 1, 2
# ORDER BY 1, 2

