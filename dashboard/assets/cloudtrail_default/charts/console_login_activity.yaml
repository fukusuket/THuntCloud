# DSH-08: Console Login Activity
# Table showing AWS Management Console sign-in attempts with success/failure breakdown.
# Failed sign-ins may indicate brute-force attacks or credential stuffing.
uuid: c1d2e3f4-a5b6-7890-abcd-ef0123456789
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Console Login Activity
viz_type: table
description: >
  AWS Management Console sign-in events grouped by IAM identity (DSH-08).
  Tracks successful and failed login attempts. A high failure-to-success ratio
  may indicate brute-force attacks, credential stuffing, or compromised credentials.
  Events are filtered to event_type = 'AwsConsoleSignIn'.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: total_logins
      hasCustomLabel: true
      optionName: metric_total_logins
    - expressionType: SQL
      sqlExpression: "COUNT(CASE WHEN error_code IS NOT NULL THEN 1 END)"
      label: failed_logins
      hasCustomLabel: true
      optionName: metric_failed_logins
    - expressionType: SQL
      sqlExpression: "COUNT(CASE WHEN error_code IS NULL THEN 1 END)"
      label: success_logins
      hasCustomLabel: true
      optionName: metric_success_logins
  groupby:
    - user_identity_arn
    - source_ip_address
  granularity_sqla: event_time
  time_range: "No filter"
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "event_type = 'AwsConsoleSignIn'"
      filterOptionName: filter_event_type
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     COALESCE(user_identity_arn, 'Unknown') AS identity,
#     source_ip_address,
#     COUNT(*)                                                  AS total_logins,
#     COUNT(CASE WHEN error_code IS NOT NULL THEN 1 END)        AS failed_logins,
#     COUNT(CASE WHEN error_code IS NULL THEN 1 END)            AS success_logins
# FROM cloudtrail_events
# WHERE event_type = 'AwsConsoleSignIn'
# GROUP BY 1, 2
# ORDER BY failed_logins DESC
# LIMIT 50

