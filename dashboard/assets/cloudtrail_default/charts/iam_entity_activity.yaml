# DSH-03: Activity Aggregation by IAM Entity
# Table showing top 50 IAM entities ranked by total API calls,
# with write-event and error-event breakdowns for quick threat prioritisation.
uuid: f6a7b8c9-d0e1-2345-f012-456789012345
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: IAM Entity Activity
viz_type: table
description: >
  Top 50 IAM entities ranked by total API calls, with write and error breakdowns (DSH-03).
  Entities with disproportionate write_events or error_events relative to total_events
  may indicate credential abuse or privilege escalation.
query_context: ""
params:
  metrics:
    - total_events
    - write_events
    - error_events
  groupby:
    - user_identity_arn
    - user_identity_type
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     COALESCE(user_identity_arn, 'Unknown')           AS iam_entity,
#     user_identity_type                                AS identity_type,
#     COUNT(*)                                          AS total_events,
#     COUNT(CASE WHEN read_only = false THEN 1 END)     AS write_events,
#     COUNT(CASE WHEN error_code IS NOT NULL THEN 1 END) AS error_events
# FROM cloudtrail_events
# GROUP BY 1, 2
# ORDER BY total_events DESC
# LIMIT 50

