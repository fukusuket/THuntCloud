metadata:
  # Native dashboard-level date range filter (DSH-15).
  # Appears in the Superset filter sidebar; applies to all charts that have
  # a temporal column configured (granularity_sqla / x_axis = event_time).
  native_filter_configuration:
    # DSH-15: Dashboard-level date range filter.
    - id: NATIVE_FILTER-timerange
      name: Date Range
      filterType: filter_time
      targets:
        - {}
      defaultDataMask:
        filterState:
          value: "No filter"
      controlValues:
        enableEmptyFilter: false
      cascadeParentIds: []
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      type: NATIVE_FILTER
      description: "Filter all charts by event_time date range"
      chartsInScope: []
      tabsInScope: []
    # Source IP Address — include mode (normal selection).
    - id: NATIVE_FILTER-source-ip
      name: "Source IP  ＋ Include"
      filterType: filter_select
      targets:
        - column:
            name: source_ip_address
          datasetUuid: d8444b4a-ac55-4710-a777-a5b940bebabe
      defaultDataMask:
        filterState:
          value: null
      controlValues:
        enableEmptyFilter: false
        defaultToFirstItem: false
        multiSelect: true
        searchAllOptions: true
        inverseSelection: false
      cascadeParentIds: []
      scope:
        rootPath:
          - ROOT_ID
        excluded: []
      type: NATIVE_FILTER
      description: "Include only the selected source IP addresses."
      chartsInScope: []
      tabsInScope: []
    # Source IP Address — NOT / exclude mode.
