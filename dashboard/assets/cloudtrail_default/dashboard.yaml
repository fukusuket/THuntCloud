# CloudTrail Threat Hunting — Dashboard Definition (DSH-06/07)
# Assembled from 5 charts defined in the charts/ directory.
# Import via: superset import-dashboards -p cloudtrail_default.zip -u admin
uuid: c3d4e5f6-a7b8-9012-cdef-123456789012
version: 1.0.0
dashboard_title: CloudTrail Threat Hunting
description: >
  Pre-built threat hunting dashboard for AWS CloudTrail logs stored in DuckDB.
  Covers event volume trends, top API calls, IAM entity activity, error patterns,
  and source IP analysis. Use SQL Lab for ad-hoc investigation queries (DSH-06).
  Export to PNG/PDF via the dashboard Download menu (DSH-07).
published: true
css: ""
slug: cloudtrail-threat-hunting

# Dashboard layout: 9-row grid
# Row 1: Full-width event time-series (DSH-01)
# Row 2: Top API calls (DSH-02) | IAM entity table (DSH-03)
# Row 3: Error trend (DSH-04)   | Source IP table  (DSH-05)
# Row 4: Console logins (DSH-08)| Access denied actions (DSH-09)
# Row 5: User agent analysis (DSH-11) — full width
# Row 6: Sensitive API calls (DSH-12) — full width
# Row 7: Root account usage (DSH-13) | Region activity (DSH-14)
# Row 8: Top countries bar (DSH-15) | World map (DSH-16) [GeoIP]
# Row 9: Top cities table (DSH-17) | Top ASN orgs table (DSH-18) [GeoIP]
