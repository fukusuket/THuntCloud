  charts:
    - slice_name: CloudTrail Events Over Time
      viz_type: echarts_timeseries_bar
      description: DSH-01 — Hourly event volume time-series.
    - slice_name: Top 20 API Calls
      viz_type: bar
      description: DSH-02 — Most frequently called AWS API actions.
    - slice_name: IAM Entity Activity
      viz_type: table
      description: DSH-03 — IAM entities ranked by API call volume.
    - slice_name: Error Occurrence Trend
      viz_type: echarts_timeseries_bar
      description: DSH-04 — Hourly error counts by error code.
    - slice_name: Top Source IP Addresses
      viz_type: table
      description: DSH-05 — External source IPs ranked by request count.
    - slice_name: Console Login Activity
      viz_type: table
      description: DSH-08 — Console sign-in attempts with success/failure breakdown.
    - slice_name: Top Access Denied Actions
      viz_type: bar
      description: DSH-09 — API actions most frequently denied access.
    - slice_name: User Agent Analysis
      viz_type: table
      description: DSH-11 — Top user agents by request count.
    - slice_name: Sensitive API Calls
      viz_type: table
      description: DSH-12 — Invocations of known high-risk API actions.
    - slice_name: Root Account Usage
      viz_type: table
      description: DSH-13 — All API calls made by the Root account.
    - slice_name: Region Activity
      viz_type: bar
      description: DSH-14 — Event distribution across AWS regions.
    - slice_name: Top Countries by Request Volume
      viz_type: dist_bar
      description: DSH-15 — Top 20 source countries by API call volume (GeoIP enrichment required).
    - slice_name: Global Request Origin Map
      viz_type: world_map
      description: DSH-16 — World map of API call origins by country (GeoIP enrichment required).
    - slice_name: Top Cities by Request Volume
      viz_type: table
      description: DSH-17 — Top 25 source cities by API call volume (GeoIP enrichment required).
    - slice_name: Top ASN Organizations by Request Volume
      viz_type: table
      description: DSH-18 — Top 25 ASN organizations by API call volume (GeoIP enrichment required).

