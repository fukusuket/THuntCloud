# Built-in Threat Hunting Queries — v2
#
# Schema:
#   category:    Sidebar grouping label
#   label:       Display name shown in the UI
#   description: One-line explanation of what this query detects and why it matters
#   prompt:      Natural language prompt sent to the AI agent (requires API key)
#   sql:         (optional) Pre-built DuckDB SQL for direct execution (no API key needed)
#
# SQL convention:
#   - Table: cloudtrail_events
#   - JSON extraction: json_extract_string(column, '$.field')
#   - All column names are snake_case (e.g. event_name, user_identity_arn)

# ===========================================================================
# Identity & Access
# ===========================================================================

- category: "\U0001f511 Identity & Access"
  label: "\U0001f511 Root Account Activity"
  description: "Detects any API call made by the root account. Root should never be used in production."
  prompt: |
    List all API calls made by the root account. Include event_time, event_name,
    source_ip_address, and aws_region. Order by most recent first.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE user_identity_type = 'Root'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f464 New IAM Users / Keys"
  description: "Identifies IAM user and access key creation events. Unexpected creation may indicate persistence."
  prompt: |
    Identify all IAM CreateUser, CreateAccessKey, and CreateLoginProfile events.
    Show who created them, when, and from which IP. Flag anything created outside
    business hours or from unexpected IPs.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName') AS new_user,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN ('CreateUser', 'CreateAccessKey', 'CreateLoginProfile')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f310 Console Logins"
  description: "Lists all console login attempts. Brute force = multiple failures followed by success."
  prompt: |
    List all ConsoleLogin events including successes and failures.
    Identify accounts with multiple failed attempts followed by a success
    (possible brute force). Include source IP and user agent.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        source_ip_address,
        aws_region,
        user_agent,
        json_extract_string(raw_event, '$.responseElements.ConsoleLogin') AS login_result,
        error_code,
        error_message
    FROM cloudtrail_events
    WHERE event_source = 'signin.amazonaws.com'
      AND event_name   = 'ConsoleLogin'
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f513 Console Login without MFA"
  description: "Detects console logins where MFA was not used. High-risk indicator of account compromise."
  prompt: |
    Find all ConsoleLogin events where MFA was not used. Include user identity,
    source IP, region, and the MFAUsed flag from additionalEventData.
    MFA-less logins are a high-priority alert.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        source_ip_address,
        aws_region,
        json_extract_string(raw_event, '$.additionalEventData.MFAUsed') AS mfa_used,
        json_extract_string(raw_event, '$.additionalEventData.LoginTo')  AS login_to
    FROM cloudtrail_events
    WHERE event_source = 'signin.amazonaws.com'
      AND event_name   = 'ConsoleLogin'
      AND json_extract_string(raw_event, '$.additionalEventData.MFAUsed') = 'No'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f504 Privilege Escalation (IAM)"
  description: "Detects IAM policy attachment and role manipulation events used for privilege escalation."
  prompt: |
    Detect potential IAM privilege escalation: look for PutUserPolicy,
    AttachUserPolicy, PutRolePolicy, AttachRolePolicy, CreatePolicyVersion,
    and SetDefaultPolicyVersion events. Show caller, target resource, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')  AS target_user,
        json_extract_string(request_parameters, '$.roleName')  AS target_role,
        json_extract_string(request_parameters, '$.policyArn') AS policy_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'PutUserPolicy', 'AttachUserPolicy',
        'PutRolePolicy', 'AttachRolePolicy',
        'CreatePolicyVersion', 'SetDefaultPolicyVersion'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f510 AssumeRole Cross-Account"
  description: "Shows AssumeRole events where caller and target are in different AWS accounts. Indicates lateral movement."
  prompt: |
    Show all AssumeRole events where the assumed role ARN is in a different
    AWS account than the caller. Include session duration and external ID if present.
    Cross-account role assumptions can indicate lateral movement.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        user_identity_account_id                                     AS caller_account,
        recipient_account_id,
        json_extract_string(request_parameters, '$.roleArn')         AS assumed_role_arn,
        json_extract_string(request_parameters, '$.externalId')      AS external_id,
        json_extract_string(request_parameters, '$.durationSeconds') AS duration_seconds,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name = 'AssumeRole'
      AND user_identity_account_id IS NOT NULL
      AND recipient_account_id     IS NOT NULL
      AND user_identity_account_id != recipient_account_id
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001fa9e Self AssumeRole Detection"
  description: "Detects roles that assume themselves. Often a code bug; counts toward STS API quotas."
  prompt: |
    Find all AssumeRole events where the caller's session issuer ARN matches the
    target role ARN (self-assume). These waste STS quota and may indicate
    misconfigured automation.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        json_extract_string(raw_event, '$.userIdentity.sessionContext.sessionIssuer.arn') AS session_issuer_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source       = 'sts.amazonaws.com'
      AND event_name         = 'AssumeRole'
      AND user_identity_type = 'AssumedRole'
      AND error_code         IS NULL
      AND json_extract_string(raw_event, '$.userIdentity.sessionContext.sessionIssuer.arn')
          = json_extract_string(raw_event, '$.resources[0].ARN')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f451 User Added to Admin Group"
  description: "Detects users added to groups with 'admin' in the name. Classic privilege escalation technique."
  prompt: |
    Find all AddUserToGroup events where the group name contains 'admin'.
    Show who performed the action, the target user, group name, and time.
    This is a classic privilege escalation indicator.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')  AS target_user,
        json_extract_string(request_parameters, '$.groupName') AS group_name,
        source_ip_address,
        aws_region
    FROM cloudtrail_events
    WHERE event_name = 'AddUserToGroup'
      AND lower(json_extract_string(request_parameters, '$.groupName')) LIKE '%admin%'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f510 MFA & Password Changes"
  description: "Detects MFA deactivation and password resets. Strong indicator of account takeover."
  prompt: |
    Detect changes to authentication settings: CreateVirtualMFADevice,
    DeactivateMFADevice, DeleteVirtualMFADevice, EnableMFADevice,
    ChangePassword, UpdateLoginProfile, DeleteLoginProfile.
    MFA deactivation or password resets may indicate account takeover.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName') AS target_user,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateVirtualMFADevice', 'DeactivateMFADevice', 'DeleteVirtualMFADevice',
        'EnableMFADevice', 'ChangePassword', 'UpdateLoginProfile', 'DeleteLoginProfile'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f5dd Access Key Abuse"
  description: "Detects access keys used from 3+ distinct source IPs in 7 days. Strong indicator of key leak."
  prompt: |
    Find access key lifecycle events: CreateAccessKey, DeleteAccessKey,
    UpdateAccessKey, GetAccessKeyLastUsed. Also check for keys used from
    multiple source_ip_address values, which may indicate key compromise.
    Show the user_identity_arn, event_time, and source_ip_address.
  sql: |
    SELECT
        user_identity_arn,
        COUNT(DISTINCT source_ip_address) AS distinct_source_ips,
        MIN(event_time)                   AS first_seen,
        MAX(event_time)                   AS last_seen,
        COUNT(*)                          AS total_events
    FROM cloudtrail_events
    WHERE event_time >= NOW() - INTERVAL '7 days'
      AND user_identity_arn IS NOT NULL
      AND source_ip_address IS NOT NULL
    GROUP BY user_identity_arn
    HAVING COUNT(DISTINCT source_ip_address) >= 3
    ORDER BY distinct_source_ips DESC
    LIMIT 50

- category: "\U0001f511 Identity & Access"
  label: "\U0001f504 Credential Report & Enumeration"
  description: "Detects IAM enumeration activity that maps the entire IAM landscape. Common in early attack stages."
  prompt: |
    Detect IAM enumeration activity: GenerateCredentialReport,
    GetCredentialReport, ListUsers, ListRoles, ListPolicies,
    GetAccountAuthorizationDetails. These calls collectively map the
    entire IAM landscape. Group by caller and time window.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'GenerateCredentialReport', 'GetCredentialReport',
        'ListUsers', 'ListRoles', 'ListPolicies',
        'GetAccountAuthorizationDetails'
    )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f3e2 Cross-Account Access"
  description: "Finds events where the caller account differs from the recipient account. Lateral movement signal."
  prompt: |
    Find all events where the caller's AWS account ID differs from the
    recipient account ID. This includes cross-account role assumptions
    and resource access. Show caller account, recipient account, event details.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_account_id AS caller_account,
        recipient_account_id,
        user_identity_arn,
        source_ip_address
    FROM cloudtrail_events
    WHERE user_identity_account_id IS NOT NULL
      AND recipient_account_id     IS NOT NULL
      AND user_identity_account_id != recipient_account_id
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f4cb Top IAM Actions by Principal"
  description: "Ranks principals by IAM API call volume. High volume may indicate enumeration or approaching service limits."
  prompt: |
    Identify the top callers of the IAM service by number of API calls.
    Show principal ARN, event names, account ID, and call count.
    High IAM activity may indicate enumeration or service limit pressure.
  sql: |
    SELECT
        user_identity_arn,
        event_name,
        recipient_account_id,
        COUNT(*) AS api_count
    FROM cloudtrail_events
    WHERE event_source      = 'iam.amazonaws.com'
      AND user_identity_arn IS NOT NULL
    GROUP BY user_identity_arn, event_name, recipient_account_id
    ORDER BY api_count DESC
    LIMIT 30

# ===========================================================================
# Detection & Response
# ===========================================================================

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6ab Access Denied Errors"
  description: "Groups AccessDenied errors by identity and API. Top offenders may indicate credential misuse."
  prompt: |
    Show all AccessDenied and UnauthorizedAccess errors in the logs.
    Group by user identity and event_name to find the top offenders.
    This can indicate credential misuse or privilege escalation attempts.
  sql: |
    SELECT
        user_identity_arn,
        event_name,
        event_source,
        COUNT(*)        AS denied_count,
        MIN(event_time) AS first_seen,
        MAX(event_time) AS last_seen
    FROM cloudtrail_events
    WHERE error_code IN ('AccessDenied', 'AccessDeniedException', 'UnauthorizedAccess')
    GROUP BY user_identity_arn, event_name, event_source
    ORDER BY denied_count DESC
    LIMIT 50

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6d1 CloudTrail Tampering"
  description: "Detects any attempt to stop or modify CloudTrail. The most critical alert — indicates cover-up."
  prompt: |
    Check for any attempts to disable or modify CloudTrail:
    StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors.
    Also check for CloudWatch Logs deletion or GuardDuty DisableDetector.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.name')     AS trail_name,
        json_extract_string(request_parameters, '$.trailARN') AS trail_arn,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateTrail', 'UpdateTrail', 'DeleteTrail',
        'StartLogging', 'StopLogging', 'PutEventSelectors',
        'DeleteLogGroup', 'DisableDetector'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\u274c Top Error Codes (Last 7 Days)"
  description: "Ranks error codes by frequency over the last 7 days. Error spikes can signal probing or outage."
  prompt: |
    Find the most frequent API error codes and messages in the past 7 days.
    Show error count, number of affected identities, first and last occurrence.
    Error spikes may indicate probing, misconfiguration, or an outage.
  sql: |
    SELECT
        error_code,
        error_message,
        COUNT(*)                          AS event_count,
        COUNT(DISTINCT user_identity_arn) AS affected_identities,
        MIN(event_time)                   AS first_seen,
        MAX(event_time)                   AS last_seen
    FROM cloudtrail_events
    WHERE error_code IS NOT NULL
      AND event_time >= NOW() - INTERVAL '7 days'
    GROUP BY error_code, error_message
    ORDER BY event_count DESC
    LIMIT 20

- category: "\U0001f6e1 Detection & Response"
  label: "\u2614 AWS Support Role Access"
  description: "Detects when AWS Support assumed the AWSServiceRoleForSupport role. Required for data sovereignty audits."
  prompt: |
    Show any events where AWS Support has taken over the AWSServiceRoleForSupport
    role. This is relevant for data sovereignty and compliance requirements.
    Include event source, name, region, resource ARN, and time.
  sql: |
    SELECT
        event_time,
        event_source,
        event_name,
        aws_region,
        source_ip_address,
        user_agent,
        user_identity_type,
        recipient_account_id
    FROM cloudtrail_events
    WHERE event_source = 'sts.amazonaws.com'
      AND user_agent LIKE '%support.amazonaws.com%'
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Data & Storage
# ===========================================================================

- category: "\U0001faa3 Data & Storage"
  label: "\U0001faa3 S3 Data Access Anomalies"
  description: "Detects bulk GetObject calls (>=100/hour) that may indicate data exfiltration."
  prompt: |
    Find unusual S3 activity: large numbers of GetObject calls from a single
    IP or user within a short time window (potential exfiltration).
    Also flag DeleteBucket, DeleteObject, and PutBucketPolicy events.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(*)                       AS call_count
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name   = 'GetObject'
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 100
    ORDER BY call_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f512 Unencrypted EBS Snapshot"
  description: "Finds EBS snapshots created without encryption. Compliance violation and data exposure risk."
  prompt: |
    Find all CreateSnapshot and CreateSnapshots events where the resulting
    snapshot is not encrypted. Show volume ID, snapshot ID, region, and caller.
    Unencrypted snapshots may violate compliance requirements.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.volumeId')   AS volume_id,
        json_extract_string(response_elements,  '$.snapshotId') AS snapshot_id,
        json_extract_string(response_elements,  '$.encrypted')  AS encrypted,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name IN ('CreateSnapshot', 'CreateSnapshots')
      AND (
          json_extract_string(response_elements, '$.encrypted') = 'false'
          OR json_extract_string(response_elements, '$.encrypted') IS NULL
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4a3 RDS Deleted without Final Snapshot"
  description: "Detects RDS instance/cluster deletion with skipFinalSnapshot=true. Potential data destruction."
  prompt: |
    Find all DeleteDBInstance and DeleteDBCluster events where the final
    snapshot was skipped. This may indicate data destruction or a destructive
    attack. Show DB name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        event_name,
        json_extract_string(request_parameters, '$.dBInstanceIdentifier') AS db_instance,
        json_extract_string(request_parameters, '$.dBClusterIdentifier')  AS db_cluster,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name IN ('DeleteDBInstance', 'DeleteDBCluster')
      AND json_extract_string(request_parameters, '$.skipFinalSnapshot') = 'true'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f513 S3 Public Access Block Disabled"
  description: "Detects S3 public access block settings being disabled. Immediate data exposure risk."
  prompt: |
    Find all PutPublicAccessBlock events where any of the four block settings
    were set to false. This exposes S3 buckets to public access.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.bucketName')                     AS bucket_name,
        json_extract_string(request_parameters, '$.PublicAccessBlockConfiguration') AS block_config,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name = 'PutPublicAccessBlock'
      AND (
          request_parameters LIKE '%"blockPublicAcls":false%'
          OR request_parameters LIKE '%"blockPublicPolicy":false%'
          OR request_parameters LIKE '%"ignorePublicAcls":false%'
          OR request_parameters LIKE '%"restrictPublicBuckets":false%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f513 KMS Key Operations"
  description: "Flags sensitive KMS operations including key deletion and high-volume Decrypt calls."
  prompt: |
    Find sensitive KMS operations: DisableKey, ScheduleKeyDeletion,
    CreateGrant, PutKeyPolicy, Decrypt (high volume from single source).
    Attackers may disable encryption or decrypt stolen data.
    Show caller identity, key ID from request_parameters, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.keyId') AS key_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'DisableKey', 'ScheduleKeyDeletion', 'CancelKeyDeletion',
        'CreateGrant', 'PutKeyPolicy', 'Decrypt'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4e7 Data Exfiltration Channels"
  description: "Detects high-volume SNS/SQS/SES/S3 PutObject calls (>=50/hour) that may indicate exfiltration."
  prompt: |
    Look for potential data exfiltration via messaging/storage services:
    SNS Publish, SQS SendMessage, SES SendEmail, and any PutObject to
    S3 buckets. Focus on high-volume calls from a single identity in a
    short time window. Filter by event_source for sns, sqs, ses, s3.
  sql: |
    SELECT
        user_identity_arn,
        event_source,
        event_name,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(*)                       AS call_count
    FROM cloudtrail_events
    WHERE event_name IN ('Publish', 'SendMessage', 'SendEmail', 'PutObject')
      AND event_source IN (
          'sns.amazonaws.com', 'sqs.amazonaws.com',
          'ses.amazonaws.com', 's3.amazonaws.com'
      )
    GROUP BY user_identity_arn, event_source, event_name, hour_bucket
    HAVING COUNT(*) >= 50
    ORDER BY call_count DESC
    LIMIT 50

# ===========================================================================
# Network & Infrastructure
# ===========================================================================

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f525 Security Group Modifications"
  description: "Detects security group rule changes, especially rules allowing 0.0.0.0/0 on any port."
  prompt: |
    Find all security group changes: AuthorizeSecurityGroupIngress,
    AuthorizeSecurityGroupEgress, RevokeSecurityGroupIngress,
    RevokeSecurityGroupEgress, CreateSecurityGroup, DeleteSecurityGroup.
    Check request_parameters for rules opening 0.0.0.0/0 or port 22/3389.
    Show caller identity, time, and the specific changes made.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.groupId') AS security_group_id,
        source_ip_address,
        request_parameters
    FROM cloudtrail_events
    WHERE event_name IN (
        'AuthorizeSecurityGroupIngress', 'AuthorizeSecurityGroupEgress',
        'RevokeSecurityGroupIngress',    'RevokeSecurityGroupEgress',
        'CreateSecurityGroup',           'DeleteSecurityGroup',
        'ModifySecurityGroupRules'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f30d Security Group Opened to Internet"
  description: "Finds security group rules that allow traffic from 0.0.0.0/0. Direct public exposure risk."
  prompt: |
    Find security group rules that allow traffic from 0.0.0.0/0 (any IP).
    This includes AuthorizeSecurityGroupIngress and ModifySecurityGroupRules.
    Show the security group ID, caller, region, and full rule parameters.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.groupId') AS security_group_id,
        source_ip_address,
        request_parameters
    FROM cloudtrail_events
    WHERE event_name IN (
        'AuthorizeSecurityGroupIngress',
        'AuthorizeSecurityGroupEgress',
        'ModifySecurityGroupRules'
    )
      AND request_parameters LIKE '%0.0.0.0/0%'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f4e1 Network Infrastructure Changes"
  description: "Detects VPC and network-level changes that may establish attacker-controlled infrastructure."
  prompt: |
    Detect VPC and network changes: CreateVpc, DeleteVpc, CreateSubnet,
    CreateInternetGateway, AttachInternetGateway, CreateNatGateway,
    CreateVpcPeeringConnection, AcceptVpcPeeringConnection,
    ModifyVpcAttribute. Show caller, region, and parameters.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateVpc', 'DeleteVpc', 'CreateSubnet', 'DeleteSubnet',
        'CreateInternetGateway', 'AttachInternetGateway', 'DetachInternetGateway',
        'CreateNatGateway', 'DeleteNatGateway',
        'CreateVpcPeeringConnection', 'AcceptVpcPeeringConnection',
        'ModifyVpcAttribute'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f5a5 Write Events from Management Console"
  description: "Identifies mutating API calls made via the AWS console. Useful when CLI-only access is expected."
  prompt: |
    List all write (mutating) API calls made via the AWS Management Console.
    These may be unexpected if your environment only uses CLI/SDK access.
    Show caller, service, action, region, and time.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        event_source,
        event_name,
        aws_region,
        source_ip_address,
        user_agent
    FROM cloudtrail_events
    WHERE read_only = false
      AND (
          json_extract_string(raw_event, '$.sessionCredentialFromConsole') = 'true'
          OR user_agent LIKE '%signin.amazonaws.com%'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f512 TLS Downgrade Detection"
  description: "Finds API calls using TLS 1.1 or older. Support ended June 2023; usage may indicate legacy clients."
  prompt: |
    Find all API calls that used TLS version 1.1 or lower. These clients
    must be upgraded as older TLS is deprecated by AWS. Show event source,
    TLS version, source IP, and call count.
  sql: |
    SELECT
        event_source,
        json_extract_string(raw_event, '$.tlsDetails.tlsVersion') AS tls_version,
        source_ip_address,
        recipient_account_id,
        COUNT(*) AS call_count
    FROM cloudtrail_events
    WHERE json_extract_string(raw_event, '$.tlsDetails.tlsVersion') LIKE 'TLSv%'
      AND TRY_CAST(
          replace(
              json_extract_string(raw_event, '$.tlsDetails.tlsVersion'),
              'TLSv', ''
          ) AS DOUBLE
      ) <= 1.1
    GROUP BY event_source, tls_version, source_ip_address, recipient_account_id
    ORDER BY call_count DESC
    LIMIT 50

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f6a7 VPC Endpoint Access Denied"
  description: "Detects access denied errors via VPC endpoints. May indicate misconfigured endpoint policy."
  prompt: |
    Find access denied errors that occurred via VPC endpoints. These may
    indicate misconfigured VPC endpoint policies or unauthorized access attempts.
    Show the VPC endpoint ID, service, caller, and error details.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        source_ip_address,
        error_code,
        error_message,
        json_extract_string(raw_event, '$.vpcEndpointId') AS vpc_endpoint_id
    FROM cloudtrail_events
    WHERE error_code IN ('AccessDenied', 'AccessDeniedException')
      AND json_extract_string(raw_event, '$.vpcEndpointId') IS NOT NULL
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Threat Patterns
# ===========================================================================

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f575 First-Time API Calls (24h)"
  description: "Finds API calls seen in the last 24h but never before. Novel operations may indicate attacker tooling."
  prompt: |
    Find API calls that appear in the last 24 hours but have never been seen
    before in the entire log dataset. These novel operations may indicate
    attacker reconnaissance or tooling.

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f319 Off-Hours Activity"
  description: "Flags mutating API calls outside business hours (JST 22:00-06:00). Human logins at night may be compromised."
  prompt: |
    Find API calls made between 10 PM and 6 AM local time (UTC 13:00–23:00 JST).
    Filter for write/mutating operations (read_only = false).
    Off-hours activity by human users may indicate compromise.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        source_ip_address,
        aws_region
    FROM cloudtrail_events
    WHERE read_only = false
      AND (
          EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') >= 22
          OR EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') < 6
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f50d Reconnaissance Pattern"
  description: "Identifies callers who ran 10+ distinct read-only API calls in one hour. Common early attack phase."
  prompt: |
    Identify potential reconnaissance: callers who executed 10 or more distinct
    Describe*, List*, or Get* API calls within any 1-hour window.
    This pattern is common in the early stages of an attack.
  sql: |
    SELECT
        user_identity_arn,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(DISTINCT event_name)     AS distinct_api_calls,
        COUNT(*)                       AS total_calls
    FROM cloudtrail_events
    WHERE (
        event_name LIKE 'Describe%'
        OR event_name LIKE 'List%'
        OR event_name LIKE 'Get%'
    )
    GROUP BY user_identity_arn, hour_bucket
    HAVING COUNT(DISTINCT event_name) >= 10
    ORDER BY distinct_api_calls DESC
    LIMIT 50

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f30d Multi-Region Activity"
  description: "Detects identities performing writes in 3+ regions in one day. Geographic spread may indicate compromise."
  prompt: |
    Identify user identities (user_identity_arn) that performed write operations
    (read_only = false) in 3 or more distinct aws_region values within the
    same day. Unusual geographic spread may indicate compromised credentials
    being used from multiple attacker locations.
  sql: |
    SELECT
        user_identity_arn,
        CAST(event_time AS DATE)       AS activity_date,
        COUNT(DISTINCT aws_region)     AS distinct_regions,
        array_agg(DISTINCT aws_region) AS regions
    FROM cloudtrail_events
    WHERE read_only = false
      AND user_identity_arn IS NOT NULL
    GROUP BY user_identity_arn, CAST(event_time AS DATE)
    HAVING COUNT(DISTINCT aws_region) >= 3
    ORDER BY distinct_regions DESC
    LIMIT 50

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f916 Unusual User Agents"
  description: "Lists rare user agents (<5 events). Custom tooling like Pacu or curl may indicate attacker tooling."
  prompt: |
    List all distinct user_agent values with their event counts.
    Flag user agents that appear fewer than 5 times — they may indicate
    custom attack tooling (e.g., Pacu, Prowler misuse, or curl/wget).
    Also flag any user_agent containing 'python', 'boto', or 'script'.
  sql: |
    SELECT
        user_agent,
        COUNT(*)                          AS event_count,
        COUNT(DISTINCT user_identity_arn) AS distinct_callers,
        MIN(event_time)                   AS first_seen,
        MAX(event_time)                   AS last_seen
    FROM cloudtrail_events
    WHERE user_agent IS NOT NULL
    GROUP BY user_agent
    HAVING COUNT(*) < 5
        OR lower(user_agent) LIKE '%pacu%'
        OR lower(user_agent) LIKE '%boto%'
        OR lower(user_agent) LIKE '%python%'
        OR lower(user_agent) LIKE '%curl%'
        OR lower(user_agent) LIKE '%wget%'
    ORDER BY event_count ASC
    LIMIT 100

# ===========================================================================
# Activity & Baseline
# ===========================================================================

- category: "\U0001f4ca Activity & Baseline"
  label: "\U0001f4ca Top Callers This Week"
  description: "Shows the 20 most active IAM entities by event count over the past 7 days."
  prompt: |
    Show the top 20 most active IAM entities (by event count) in the past 7 days.
    Break down by read vs write operations. Flag any service accounts performing
    an unusually high number of mutating calls.
  sql: |
    SELECT
        user_identity_arn,
        COUNT(*)                                    AS total_events,
        COUNT(*) FILTER (WHERE read_only = true)    AS read_events,
        COUNT(*) FILTER (WHERE read_only = false)   AS write_events,
        COUNT(DISTINCT aws_region)                  AS regions_active,
        MAX(event_time)                             AS last_seen
    FROM cloudtrail_events
    WHERE event_time >= NOW() - INTERVAL '7 days'
      AND user_identity_arn IS NOT NULL
    GROUP BY user_identity_arn
    ORDER BY total_events DESC
    LIMIT 20

- category: "\U0001f4ca Activity & Baseline"
  label: "\u274c Error Spike Detection"
  description: "Finds 1-hour windows where error count exceeds the daily average by 3x. Signals scanning or outage."
  prompt: |
    Find time windows (1-hour buckets) where the total number of API errors
    (error_code IS NOT NULL) exceeds the daily average by 3x or more.
    Show the time bucket, error count, top error codes, and the user
    identities generating the most errors.

- category: "\U0001f4ca Activity & Baseline"
  label: "\U0001f4ca Activity by Region"
  description: "Counts API calls per AWS region. Unexpected regions may indicate unauthorized resource creation."
  prompt: |
    Show the total number of API calls broken down by AWS region.
    Highlight regions with unusually high activity or regions that are
    not normally used by this account (potential unauthorized resource creation).
  sql: |
    SELECT
        aws_region,
        COUNT(*)                                    AS total_events,
        COUNT(*) FILTER (WHERE read_only = false)   AS write_events,
        COUNT(DISTINCT user_identity_arn)            AS distinct_callers,
        MIN(event_time)                              AS first_event,
        MAX(event_time)                              AS last_event
    FROM cloudtrail_events
    GROUP BY aws_region
    ORDER BY total_events DESC

- category: "\U0001f4ca Activity & Baseline"
  label: "\U0001f50d Events with Errors (24h)"
  description: "Lists all error events in the past 24 hours. Quick overview of what is failing right now."
  prompt: |
    Show all API calls in the past 24 hours that resulted in errors.
    Include caller, service, action, region, error code and message.
    Useful for quickly identifying what is failing or being probed.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        event_source,
        event_name,
        aws_region,
        source_ip_address,
        user_agent,
        error_code,
        error_message
    FROM cloudtrail_events
    WHERE error_code IS NOT NULL
      AND event_time >= NOW() - INTERVAL '24 hours'
    ORDER BY event_time DESC
    LIMIT 200

# ===========================================================================
# Compute & Serverless
# ===========================================================================

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f5a5 EC2 Instance Launches"
  description: "Lists all RunInstances events. Unexpected launches in unusual regions may indicate cryptomining."
  prompt: |
    List all RunInstances events. Show who launched the instances, when,
    from which IP, and in which region. Flag launches by unexpected users
    or in regions not normally used by this account. Include instance type
    from request_parameters if available.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.instanceType') AS instance_type,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name = 'RunInstances'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\u26a1 Lambda Function Tampering"
  description: "Detects Lambda creation, code updates, and permission changes. Attackers use Lambda for persistence."
  prompt: |
    Find Lambda-related events: CreateFunction, UpdateFunctionCode,
    UpdateFunctionConfiguration, AddPermission, CreateEventSourceMapping.
    Attackers may deploy malicious functions for persistence or crypto mining.
    Show caller, function details from request_parameters, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.functionName') AS function_name,
        json_extract_string(request_parameters, '$.runtime')      AS runtime,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateFunction20150331', 'CreateFunction',
        'UpdateFunctionCode20150331v2', 'UpdateFunctionCode',
        'UpdateFunctionConfiguration20150331v2', 'UpdateFunctionConfiguration',
        'AddPermission20150331v2', 'AddPermission',
        'CreateEventSourceMapping'
    )
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# IaC & Platform
# ===========================================================================

- category: "\u2601 IaC & Platform"
  label: "\U0001f3d7 CloudFormation / IaC Abuse"
  description: "Detects CloudFormation stack operations. Attackers may use IaC to rapidly deploy malicious infrastructure."
  prompt: |
    Find CloudFormation stack operations: CreateStack, UpdateStack,
    DeleteStack, CreateChangeSet. Attackers may use IaC to rapidly deploy
    malicious infrastructure. Show stack name from request_parameters,
    caller identity, and whether the operation succeeded or failed.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.stackName') AS stack_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateStack', 'UpdateStack', 'DeleteStack',
        'CreateChangeSet', 'ExecuteChangeSet'
    )
    ORDER BY event_time DESC
    LIMIT 100
