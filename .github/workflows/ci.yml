# CI — THuntCloud
# Runs on every push and pull request to main / develop branches.
# Checks: Rust (cargo test + clippy + fmt) and Python (pytest + ruff + black).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust ingester ──────────────────────────────────────────────────────────
  ingester:
    name: ingester (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies for DuckDB bundled build
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ingester -> target"

      - name: Check formatting (rustfmt)
        working-directory: ingester
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        working-directory: ingester
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: ingester
        run: cargo test --all

  # ── Python agent ───────────────────────────────────────────────────────────
  agent:
    name: agent (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v5.0.4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('agent/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install runtime and dev dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting (black)
        working-directory: agent
        run: black --check .

      - name: Lint (ruff)
        working-directory: agent
        run: ruff check .

      - name: Run tests (pytest)
        working-directory: agent
        run: pytest -v --tb=short

  # ── YAML validation ────────────────────────────────────────────────────────
  dashboard-yaml:
    name: dashboard YAML validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all dashboard YAML files are well-formed
        run: |
          python3 - <<'EOF'
          import sys
          import yaml
          from pathlib import Path

          errors = []
          yaml_files = list(Path("dashboard/assets").rglob("*.yaml"))
          print(f"Validating {len(yaml_files)} YAML file(s)...")

          for f in yaml_files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f"  OK  {f}")
              except yaml.YAMLError as exc:
                  errors.append((f, exc))
                  print(f"  ERR {f}: {exc}")

          if errors:
              print(f"\n{len(errors)} YAML file(s) failed validation.")
              sys.exit(1)
          else:
              print(f"\nAll {len(yaml_files)} YAML files are valid.")
          EOF

      - name: Verify ZIP contains all required files
        run: |
          python3 - <<'EOF'
          import zipfile
          import sys
          from pathlib import Path

          zip_path = Path("dashboard/assets/cloudtrail_default.zip")
          if not zip_path.exists():
              print("ERROR: cloudtrail_default.zip not found")
              sys.exit(1)

          required = {
              "metadata.yaml",
              "dashboards/cloudtrail_threat_hunting.yaml",
              "databases/CloudTrail_DuckDB.yaml",
              "datasets/CloudTrail_DuckDB/cloudtrail_events.yaml",
              "charts/CloudTrail_Events_Over_Time.yaml",
              "charts/Top_20_API_Calls.yaml",
              "charts/IAM_Entity_Activity.yaml",
              "charts/Error_Event_Trend.yaml",
              "charts/Top_Source_IP_Addresses.yaml",
          }

          with zipfile.ZipFile(zip_path) as zf:
              names = set(zf.namelist())

          missing = required - names
          if missing:
              print(f"ERROR: ZIP is missing required files: {missing}")
              sys.exit(1)
          else:
              print(f"ZIP contains all {len(required)} required files. OK")
          EOF

