# Release — THuntCloud ingester
# Triggered on every version tag (v*).
# Builds the ingester binary for x86_64 and aarch64 Linux (glibc) on native
# GitHub-hosted runners and publishes them as GitHub Release assets:
#   ingester-x86_64-linux  / ingester-x86_64-linux.sha256
#   ingester-aarch64-linux / ingester-aarch64-linux.sha256
#
# The pre-built binaries are consumed by the Docker prebuilt-runtime target to
# skip Rust compilation during `docker compose build`.  Docker selects the
# correct binary automatically based on the build platform (TARGETARCH).
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-ingester:
    name: Release ingester binary (${{ matrix.binary }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail_fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: ingester-x86_64-linux
            cache_key: x86_64
          - runner: ubuntu-24.04-arm
            binary: ingester-aarch64-linux
            cache_key: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies for DuckDB bundled build
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ingester/target
          key: ${{ runner.os }}-${{ matrix.cache_key }}-cargo-release-${{ hashFiles('ingester/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.cache_key }}-cargo-

      - name: Build release binary
        working-directory: ingester
        run: cargo build --release --locked

      - name: Stage binary with platform-tagged name
        run: cp ingester/target/release/ingester /tmp/${{ matrix.binary }}

      - name: Generate SHA256 checksum
        run: |
          cd /tmp
          sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Create GitHub Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/${{ matrix.binary }}
            /tmp/${{ matrix.binary }}.sha256
          generate_release_notes: true
