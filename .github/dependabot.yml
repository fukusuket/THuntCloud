# Dependabot configuration — THuntCloud
# Automates dependency update PRs so humans review every version bump.
# See doc/SUPPLY_CHAIN_HARDENING.md Phase 4 for rationale.
#
# Branch protection rule recommended: require the "frontend" CI job to pass
# before any Dependabot PR targeting config_viz/frontend can be merged.

version: 2
updates:
  # ── npm (config_viz frontend) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/config_viz/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Group patch updates for devDependencies into a single PR to reduce noise.
    groups:
      dev-patch-updates:
        patterns: ["*"]
        update-types: ["patch"]
        dependency-type: "development"
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "chore(frontend)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # ── Rust (ingester) ───────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/ingester"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "chore(ingester)"

