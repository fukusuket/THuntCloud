# DSH-04: Error Occurrence Trend
# Stacked hourly bar chart of API errors grouped by error code.
# Spikes in AccessDenied may indicate credential scanning or privilege escalation attempts.
slice_name: Error Occurrence Trend
viz_type: echarts_timeseries_bar
description: >
  Hourly error counts grouped by error code (DSH-04).
  Spikes in AccessDenied or UnauthorizedAccess errors are strong indicators
  of credential misuse, privilege escalation, or automated scanning activity.
dataset_name: cloudtrail_events
params:
  x_axis: hour
  time_grain_sqla: PT1H
  metrics:
    - error_count
  groupby:
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "error_code IS NOT NULL"
  row_limit: 10000
  stack: true
  x_axis_title: Time
  y_axis_title: Error Count
  color_scheme: supersetColors
  rich_tooltip: true
  tooltipTimeFormat: "%Y-%m-%d %H:%M"
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     date_trunc('hour', event_time)  AS hour,
#     COALESCE(error_code, 'NoError') AS error_code,
#     COUNT(*)                        AS error_count
# FROM cloudtrail_events
# WHERE error_code IS NOT NULL
# GROUP BY 1, 2
# ORDER BY 1, 3 DESC

