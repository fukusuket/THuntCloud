# DSH-11: User Agent Analysis
# Table of top user agents by request count with error and write breakdowns.
uuid: f4a5b6c7-d8e9-0123-def0-123456789012
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: User Agent Analysis
viz_type: table
description: >
  Top 50 user agents by request count with error and write breakdowns (DSH-11).
  Unusual or custom user agents (e.g. Python/boto3, custom scripts, Pacu, ScoutSuite)
  may indicate automated attack tooling. AWS internal agents (console.amazonaws.com,
  signin.amazonaws.com) are expected; unknown strings warrant investigation.
query_context: ""
params:
  metrics:
    - request_count
    - write_requests
    - error_requests
    - unique_identities
  groupby:
    - user_agent
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     COALESCE(user_agent, 'N/A')                         AS user_agent,
#     COUNT(*)                                             AS request_count,
#     COUNT(CASE WHEN read_only = false THEN 1 END)        AS write_requests,
#     COUNT(CASE WHEN error_code IS NOT NULL THEN 1 END)   AS error_requests,
#     COUNT(DISTINCT user_identity_arn)                    AS unique_identities
# FROM cloudtrail_events
# GROUP BY user_agent
# ORDER BY request_count DESC
# LIMIT 50

