# DSH-01: CloudTrail Event Time-Series Chart
# Hourly count of CloudTrail API calls visualised as a bar chart.
slice_name: CloudTrail Events Over Time
viz_type: echarts_timeseries_bar
description: >
  Hourly count of CloudTrail API calls over time (DSH-01).
  Useful for identifying activity spikes and off-hours operations.
dataset_name: cloudtrail_events
query_context: null
params:
  x_axis: hour
  time_grain_sqla: PT1H
  metrics:
    - event_count
  adhoc_filters: []
  row_limit: 10000
  x_axis_title: Time
  y_axis_title: Event Count
  color_scheme: supersetColors
  rich_tooltip: true
  tooltipTimeFormat: "%Y-%m-%d %H:%M"
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     date_trunc('hour', event_time) AS hour,
#     COUNT(*)                       AS event_count
# FROM cloudtrail_events
# GROUP BY 1
# ORDER BY 1

