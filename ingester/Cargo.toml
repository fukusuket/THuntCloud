[package]
name = "ingester"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono             = "0.4"
glob               = "0.3"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
flate2             = "1.0"
duckdb             = { version = "1.1", features = ["bundled"] }
clap               = { version = "4.5", features = ["derive"] }
anyhow             = "1.0"
indicatif          = "0.17"
walkdir            = "2.5"
rayon              = "1.10"
sha2               = "0.10"
hex                = "0.4"
# MaxMind GeoIP2 / GeoLite2 .mmdb database reader
maxminddb          = "0.24"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile           = "3.14"
assert_cmd         = "2.0"
predicates         = "3.1"
