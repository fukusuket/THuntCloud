version: "3.9"

# ─────────────────────────────────────────────
# AWS Log Threat Hunting Tool — Docker Compose
# ─────────────────────────────────────────────
# DuckDB access model:
#   ingester  → READ_WRITE  (exclusive writer)
#   agent     → READ_ONLY   (reader)
#   dashboard → READ_ONLY   (reader)
#
# Always run ingester FIRST, then start agent/dashboard.
#
# Volume strategy:
#   DuckDB data is bind-mounted directly in each service rather than via a
#   named volume with driver_opts, because Docker Engine on Linux (including
#   WSL2) requires absolute paths for named-volume bind mounts — relative paths
#   are silently mis-resolved, causing ingester and Superset to use different
#   storage locations.  Docker Compose resolves relative paths in *service*
#   volume entries correctly on all platforms (macOS, Linux, WSL2), so this
#   approach is cross-platform safe.
#
#   Default host path : ./data/db  (relative to this docker-compose.yml)
#   Override          : set DUCKDB_HOST_PATH to an absolute path in .env
#                       e.g. DUCKDB_HOST_PATH=/home/youruser/THuntCloud/docker/data/db
# ─────────────────────────────────────────────

services:

  # ── ingester ──────────────────────────────
  ingester:
    build:
      context: ../ingester
      dockerfile: Dockerfile
    container_name: threat-hunting-ingester
    volumes:
      - ${DUCKDB_HOST_PATH:-./data/db}:/data/db          # READ_WRITE
      - ./logs:/data/logs:ro                              # Source log directory (read-only bind)
    environment:
      - DUCKDB_PATH=/data/db/threat_hunting.db
      - RUST_LOG=${RUST_LOG:-info}
    profiles:
      - ingest                        # Run only when explicitly invoked
    # Usage: docker compose --profile ingest run --rm ingester ingest --path /data/logs/flaws_cloudtrail_logs

  # ── agent (Streamlit AI UI) ───────────────
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: threat-hunting-agent
    ports:
      - "8501:8501"
    volumes:
      - ${DUCKDB_HOST_PATH:-./data/db}:/data/db:ro       # READ_ONLY
    environment:
      - DUCKDB_PATH=/data/db/threat_hunting.db
      - DUCKDB_READONLY=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4}
      - OPENAI_MODEL_LITE=${OPENAI_MODEL_LITE:-gpt-5.4-mini}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Superset dashboard ────────────────────
  superset:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: threat-hunting-dashboard
    ports:
      - "8088:8088"
    volumes:
      - ${DUCKDB_HOST_PATH:-./data/db}:/data/db          # READ_ONLY enforced at connection level (connect_args read_only=True)
      - superset_home:/app/superset_home
      - ../dashboards:/app/dashboards:ro                  # Pre-built dashboard ZIPs
      - ../dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro  # Config overrides
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-in-production}
      - DUCKDB_PATH=/data/db/threat_hunting.db
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully

  # ── Superset initializer (run-once) ───────
  superset-init:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: threat-hunting-superset-init
    volumes:
      - ${DUCKDB_HOST_PATH:-./data/db}:/data/db          # READ_ONLY enforced at connection level (connect_args read_only=True)
      - superset_home:/app/superset_home
      - ../dashboards:/app/dashboards:ro
      - ../dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro  # Config overrides
      - ../dashboard/init/bootstrap.sh:/app/bootstrap.sh:ro                    # Init script
      - ../dashboard/init/register_duckdb.py:/app/register_duckdb.py:ro        # DuckDB registration script
      - ../dashboard/init/register_dataset.py:/app/register_dataset.py:ro      # Dataset registration script
      - ../dashboard/init/import_dashboard.py:/app/import_dashboard.py:ro      # Dashboard import script
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-in-production}
      - SUPERSET_ADMIN_USERNAME=${SUPERSET_ADMIN_USERNAME:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
      - SUPERSET_ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL:-admin@localhost}
      - DUCKDB_PATH=/data/db/threat_hunting.db
    entrypoint: ["/bin/bash", "/app/bootstrap.sh"]
    restart: "no"

  # ── Superset metadata re-sync (on-demand) ──────────────────────────────────
  # Re-syncs the cloudtrail_events dataset column metadata after re-ingestion.
  # Run this when the dashboard shows no data after a fresh ingest:
  #   docker compose --profile resync run --rm superset-resync
  superset-resync:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: threat-hunting-superset-resync
    volumes:
      - ${DUCKDB_HOST_PATH:-./data/db}:/data/db:ro
      - superset_home:/app/superset_home
      - ../dashboard/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../dashboard/init/register_dataset.py:/app/register_dataset.py:ro
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-change-me-in-production}
      - DUCKDB_PATH=/data/db/threat_hunting.db
      - FORCE_RESYNC=true
    entrypoint: ["python3", "/app/register_dataset.py"]
    restart: "no"
    profiles:
      - resync                        # Run only when explicitly invoked

# ── Volumes ───────────────────────────────────
# Note: duckdb_data is no longer a named volume.  Each service uses a direct
# bind mount (see service volumes above) so that Docker Compose — not the
# Docker daemon — resolves the relative path.  This is required for
# Linux / WSL2 compatibility.
volumes:

  superset_home:
    name: threat-hunting-superset-home
